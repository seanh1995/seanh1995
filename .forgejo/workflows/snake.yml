name: Snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  generate:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # Run snk's bundled action script directly rather than via `uses:`. The
      # Forgejo runner injects its own GITHUB_TOKEN into action steps, which
      # snk reads before its token input and which GitHub rejects; setting it
      # inline on the command keeps the GitHub PAT in place.
      - name: Generate snake animation
        env:
          SNK_GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          INPUT_GITHUB_USER_NAME: seanh1995
          INPUT_OUTPUTS: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        run: |
          git clone --quiet --depth 1 --branch v3 https://github.com/Platane/snk /tmp/snk
          GITHUB_TOKEN="$SNK_GITHUB_TOKEN" node /tmp/snk/svg-only/dist/index.js

      - name: Commit generated assets
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.code.seantestenv.co.uk"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate snake animation"
          git pull --rebase origin main
          git push
