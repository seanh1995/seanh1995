name: Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_typing_svg.py"
      - ".github/workflows/assets.yml"

jobs:
  build-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate typing SVG
        run: python3 scripts/generate_typing_svg.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Regenerate typing SVG"
          git push
